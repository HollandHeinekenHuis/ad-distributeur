apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: app
  template:
    metadata:
      labels:
        app: app
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: registry.basable.com/abandon-above-today/ad-distributeur
          ports:
            - containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: villa-db-app
                  key: uri
            - name: VILLA_NAME
              value: "Villa Les Oliviers"
            - name: PRICE_PER_NIGHT
              value: "350"
            - name: CURRENCY
              value: "EUR"
            - name: MAX_GUESTS
              value: "8"
            - name: MIN_NIGHTS
              value: "2"
            # Email: leave SMTP_HOST empty to only log emails. Fill in later.
            - name: SMTP_HOST
              value: ""
            - name: SMTP_PORT
              value: "587"
            - name: MAIL_FROM
              value: "bookings@example.com"
            - name: OWNER_EMAIL
              value: ""
            - name: SMTP_USER
              valueFrom:
                secretKeyRef:
                  name: smtp-credentials
                  key: username
                  optional: true
            - name: SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: smtp-credentials
                  key: password
                  optional: true
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 15
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
